# Components (chip-agnostic)
set(CONFIG_BFLOG n)
set(CONFIG_FREERTOS y)
set(CONFIG_POSIX n)
set(CONFIG_TLSF y)
set(CONFIG_SHELL n)
# lwIP removed — the network stack is being switched to FreeRTOS-Plus-TCP.
# CONFIG_LWIP=off also drops platform/bouffalo_sdk/components/net/lwip, the
# mbedtls port's net_sockets.c (if(CONFIG_LWIP)) and the fota lwip path.
# set(CONFIG_LWIP y)
set(CONFIG_RF y)
set(CONFIG_MBEDTLS y)
# set(CONFIG_PSRAM y)   # bl602dk has no PSRAM; bl616dk does -> enabled in the bl616 block below
# set(CONFIG_DHCPD y)   # lwIP DHCP server — removed with the lwIP stack
# set(CONFIG_PING y)    # lwIP ping app — removed with the lwIP stack
# set(CONFIG_MQTT y)
set(CONFIG_BFLB_MTD y)
set(CONFIG_PARTITION y)
set(CONFIG_EASYFLASH4 y)

set(CONFIG_VSNPRINTF_FLOAT      y)
set(CONFIG_VSNPRINTF_FLOAT_EX   y)
set(CONFIG_VSNPRINTF_LONG_LONG  y)

# mbedtls
set(CONFIG_MBEDTLS_AES_USE_HW y)
set(CONFIG_MBEDTLS_BIGNUM_USE_HW y)
set(CONFIG_MBEDTLS_ECC_USE_HW y)
set(CONFIG_MBEDTLS_SHA1_USE_HW y)
set(CONFIG_MBEDTLS_SHA256_USE_HW y)
set(CONFIG_MBEDTLS_SHA512_USE_HW y)

# wifi caps used by lwipopts_user.h on all chips
# (BL616 / BL616CL bump these in their chip-specific block below)
set(CONFIG_MAC_TXQ_DEPTH 4)
set(CONFIG_MAC_RXQ_DEPTH 4)

# coex
set(CONFIG_COEX                  y)
set(CONFIG_COEX_WIFI_MODE        1)
set(CONFIG_COEX_BT_MODE          1)
set(CONFIG_COEX_TDMA_NONE        2)

# ble (common)
set(CONFIG_BLUETOOTH y)
set(CONFIG_BLE_USE_MAC2 n)
set(CONFIG_BLE_TP_SERVER y)
set(CONFIG_BLSYNC y)
# NimBLE host is OPT-IN, mirroring AmebaD's default (AMEBAD_ENABLE_NIMBLE OFF). bl602 has only
# 176 KB RAM; running the BLE controller + NimBLE host alongside WiFi + the console/sntp/iperf
# tasks overflows the heap (WiFi init OOMs). The base image is WiFi + console + sntp + iperf, same
# feature set as the AmebaD default; build a BLE image with `make ... NIMBLE=ON` (or MCUMGR=ON,
# which forces NIMBLE=ON). The Makefile passes -DAT_ENABLE_NIMBLE / -DAT_ENABLE_MCUMGR; honor a
# value provided on the cmake command line, else default OFF here (don't clobber the -D).
if(NOT DEFINED AT_ENABLE_NIMBLE)
    set(AT_ENABLE_NIMBLE OFF)
endif()

# Chip-specific
if(BOUFFALO_CHIP STREQUAL "bl602")
    # wifi4 stack
    set(CONFIG_WIFI4 y)
    # 旧式 blecontroller
    set(CONFIG_BLECONTROLLER_LIB m1s1)
    # ROM API — bl602_std/CMakeLists.txt 看到这个就拉 bl602_romapi.c +
    # define BFLB_USE_ROM_DRIVER，让 bl602_aon/common/ef_ctrl/sf_cfg/sflash/
    # xip_sflash 里 #ifndef BFLB_USE_ROM_DRIVER 的整段 full implementation
    # 被 ifdef 出去，只留 bl602_romapi.c 里 __ALWAYS_INLINE 的 10-byte
    # thunk（call ROM_APITABLE[index] 而已）。upstream wifi_tcp 例子 ITCM
    # 3884 B / 16 KB (23.71%) vs 我们之前 23860 B 的差距主要就来自这一条。
    set(CONFIG_ROMAPI y)
elseif(BOUFFALO_CHIP STREQUAL "bl616")
    # BL616 / BL616CL 走 wl80211 driver（不是 wifi6/fhost；wifi6/fhost 跟
    # wl80211 是 platform/bouffalo_sdk/components/wireless/ 下俩并行的栈，
    # wl80211 是我们要的那个 —— prebuilt .a in
    # component/bouffalo_sdk/wl80211/lib/libwl80211_${BOUFFALO_CHIP}.a，依赖 macsw +
    # bl_wpa_supplicant + lwip + FreeRTOS）。
    # CONFIG_MACSW_SELECT 选 macsw 预编译 .a 的 variant，default 是基础那个；
    # bl616 还有 coex / bridge / ack 变体可用但 .a 没 copy 过来，要新变体往
    # component/bouffalo_sdk/macsw/lib/ 加再扩 CMakeLists 即可。
    set(CONFIG_WIFI6 y)
    # WiFi driver switched from wl80211 to fhost (see project_bl616_aws_ota memory):
    # CONFIG_WL80211 / CONFIG_BL_WPA_SUPPLICANT / CONFIG_MACSW_SELECT removed. fhost brings
    # its own supplicant + MAC-SW adapter from platform/.../wireless/wifi6/.
    set(CONFIG_BTBLECONTROLLER_LIB ble1m10s1bredr0)
    set(CONFIG_VIF_MAX 2)
    set(CONFIG_STA_MAX 4)
    set(CONFIG_MAC_TXQ_DEPTH 16)
    set(CONFIG_MAC_RXQ_DEPTH 12)
    # HW AES OFF on bl616 (software mbedtls AES). Two independent reasons, both proven on HW
    # (memory project_bl616_quic_hwaes_bug): (1) CORRECTNESS — under bulk crypto (QUIC 4 MB
    # download, and any large TLS/OTA transfer) the Sec_Eng AES DMA (bflb_aes_link, one DMA per
    # 16 B block) contends with the flash XIP controller and glitches CPU instruction-fetch from
    # XIP -> illegal-instruction crash inside the software GHASH (gcm_mult_smalltable) at ~192 KB.
    # (2) ZERO BENEFIT — bl616 HW only accelerates AES-CTR (GHASH stays software), and the
    # per-16 B-block DMA overhead cancels it: HW gives 2.39/1.30 Mbps vs software 2.36/1.28, i.e.
    # identical, because bl616 QUIC is LINK-bound (2.4G-only die, band_5g=0; iperf raw TCP RX on
    # this congested-2.4G bench = 2.10 Mbps, so QUIC at 2.39 is already at the link ceiling).
    # HW SHA/ECC/bignum stay ON below (used in the TLS handshake, no bulk per-block DMA -> safe).
    # (Moving gcm.c/aes_alt.c to ITCM/RAM does fix the crash and let HW AES run -- verified -- but
    # for no throughput gain and +10 KB RAM, so not worth it; see the memory for that ld.in recipe.)
    set(CONFIG_MBEDTLS_AES_USE_HW n)
    # NO PSRAM on this bl616 die: board_psram_x8_init() reads bflb_efuse_get_device_info().psram_info
    # and this chip reports 0 ("psram_info NO" in the boot chip-info dump), so it is a plain BL616
    # variant without embedded PSRAM (the PSRAM part is BL618). Enabling CONFIG_PSRAM makes
    # board_psram_x8_init() print "This chip has no psram" and while(1){} -> boot hangs at detection.
    # Default OFF (bl616dk has no PSRAM). `make PSRAM=ON` (a BL618/PSRAM die) -DAT_ENABLE_PSRAM=ON ->
    # register the 4 MB PSRAM as heap: pvPortMalloc (MM_FLAG_HEAP_ANY) then falls back to it, so ota_http's
    # 2nd (S3) TLS handshake has room alongside the live AWS MQTT TLS instead of OOMing OCRAM.
    if(AT_ENABLE_PSRAM STREQUAL "ON")
        set(CONFIG_PSRAM y)
    endif()
    # Skip board_set_flash_80m() (bsp/board/bl616dk/board_flash_psram.c). On this bench the app's
    # runtime flash cfg has continuous-read ON (g_flash_cfg cReadSupport=1, ioMode=0x04) while the
    # bootheader flashCfg the ROM/boot2 use has it OFF (0x11/0x00); the 80 MHz re-init path
    # (bflb_sflash_reset_continue_read) corrupts XIP mid-execution -> the core runs away to
    # 0xA4000000 (XIP-window end) BEFORE the console inits -> zero boot output. Diagnosed via
    # CKLink+gdb (memory project_bl616_boot_crash_flash80m). CONFIG_BOARD_FLASH_LOW_SPEED is the
    # SDK-sanctioned opt-out (boot2_isp uses it); flash stays at the boot2-configured speed.
    set(CONFIG_BOARD_FLASH_LOW_SPEED y)
elseif(BOUFFALO_CHIP STREQUAL "bl616cl")
    set(CONFIG_WIFI6 y)
    # WiFi driver = fhost (wl80211 removed; see bl616 block + project_bl616_aws_ota memory).
    set(CONFIG_BTBLECONTROLLER_LIB m2s1)
    set(CONFIG_VIF_MAX 2)
    set(CONFIG_STA_MAX 4)
    set(CONFIG_MAC_TXQ_DEPTH 16)
    set(CONFIG_MAC_RXQ_DEPTH 12)
else()
    message(FATAL_ERROR "Unsupported BOUFFALO_CHIP: ${BOUFFALO_CHIP}")
endif()
