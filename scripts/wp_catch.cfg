# One-shot watchpoint catcher: halt on the instruction that writes the corrupt
# value (0x2) into network-buffer descriptor #20's pucEthernetBuffer (0x10018d80).
# Sourced AFTER amebad_openocd.cfg (which defines the ameba.km4 target).
init
targets ameba.km4

# Clean controlled reset: driver-only lands in the ROM reset-handshake spin; set the
# watchpoint there, satisfy the handshake (0x480003f8 bit25), then let it boot once.
reset halt
echo "RESET_PC:"
reg pc

# 4-byte write watchpoint on #20 pucEthernetBuffer
wp 0x10018d80 4 w
echo "WP_SET:"
wp

# satisfy the inter-core reset handshake so the app actually boots under the debugger
mww 0x480003f8 0x02000201

set caught 0
for {set i 0} {$i < 50} {incr i} {
    resume
    if {[catch {wait_halt 5000} e]} { echo "ITER $i WAIT_ERR $e"; continue }
    set v 0
    catch { set v [lindex [read_memory 0x10018d80 32 1] 0] }
    echo "ITER $i VAL=$v"
    # .bss-zero writes v==0 (skip); legit buffer allocs are large (skip);
    # the corruption writes a tiny non-zero value (0x2) -> catch.
    if {$v != 0 && $v < 4096} { set caught 1; break }
}
echo "CATCH_DONE caught=$caught"
echo "FAULT_PC:"
reg pc
reg sp
reg lr
echo "FIELD_NOW:"
mdw 0x10018d80
shutdown
