# amebad_openocd.cfg — OpenOCD debug config for Realtek AmebaD (RTL8721D)
#
# Dual-core: KM0 (low-power, Cortex-M23) + KM4 (high-perf, Cortex-M33 w/ TrustZone).
#
# CoreSight AP map is taken straight from the SDK's J-Link scripts
# (platform/ameba-rtos-d/.../jlink_script/AP{1,2}_KM4.JLinkScript):
#     AP0 = APB-AP  (CTRL_AP / authentication, SWD password)
#     AP1 = AHB-AP  -> KM0  (CORESIGHT_IndexAHBAPToUse = 1, "Cortex-M23 CPU")
#     AP2 = AHB-AP  -> KM4  (CORESIGHT_IndexAHBAPToUse = 2)
#     AP3 = APB-AP  (SWD password)
# i.e. the same AP layout as amebadplus, so this mirrors the SDK's
# amebadplus_openocd.cfg with AmebaD core types/defaults.
#
# Host setup (see .claude/skills/ameba-openocd-flash): xPack openocd.exe on the
# Windows side + RV CMSIS-DAP probe, driven from WSL.
#
# Usage:
#   openocd -c "set ADAPTER_TYPE daplink" -c "set ADAPTER_SPEED 4000" -f scripts/amebad_openocd.cfg
#   openocd -c "set ADAPTER_TYPE jlink"   -c "set ADAPTER_SPEED 1000" -f scripts/amebad_openocd.cfg
#
# Connection check only (no gdb):
#   openocd ... -f scripts/amebad_openocd.cfg -c "init; exit"
# Healthy: "[ameba.km4] Examination succeed" and "[ameba.km0] Examination succeed".
#
# Debug a single core (e.g. KM0 wedged in deep sleep -> disable it):
#   openocd ... -c "set ENABLE_KM0 0" -f scripts/amebad_openocd.cfg -c init
#
# Then attach: arm-none-eabi-gdb / gdb-multiarch -ex "target extended-remote :3335" (KM4)
#                                                 -ex "target extended-remote :3331" (KM0)

# -----------------------------------------------------------------
# 1. Default Parameters
# -----------------------------------------------------------------
if { [info exists ADAPTER_TYPE] == 0 } { set ADAPTER_TYPE "daplink" }
if { [info exists ADAPTER_SPEED] == 0 } { set ADAPTER_SPEED 4000 }

# Optional: allow user to disable cores (e.g. KM0 stuck in tickless deep sleep)
if { [info exists ENABLE_KM4] == 0 } { set ENABLE_KM4 1 }
if { [info exists ENABLE_KM0] == 0 } { set ENABLE_KM0 1 }

echo "Using adapter: $ADAPTER_TYPE"
echo "SWD speed: ${ADAPTER_SPEED} kHz"

# -----------------------------------------------------------------
# 2. Load Adapter Config Dynamically
# -----------------------------------------------------------------
if { $ADAPTER_TYPE eq "jlink" } {
    source [find interface/jlink.cfg]
} elseif { $ADAPTER_TYPE eq "daplink" } {
    source [find interface/cmsis-dap.cfg]
} else {
    error "Unsupported ADAPTER_TYPE: $ADAPTER_TYPE (use 'jlink' or 'daplink')"
}

transport select swd
adapter speed $ADAPTER_SPEED

# -----------------------------------------------------------------
# 3. examine-fail guard: bail out instead of spinning forever if the
#    probe loses the DUT (3 fails within 30s -> shutdown). Mirrors the
#    SDK's amebadplus_openocd.cfg behaviour.
# -----------------------------------------------------------------
array set _ameba_fail_counts {}
array set _ameba_first_fail_times {}

proc ameba_examine_hook { core_name } {
    global _ameba_fail_counts
    global _ameba_first_fail_times
    set current_time [clock seconds]
    if { ![info exists _ameba_fail_counts($core_name)] } {
        set _ameba_fail_counts($core_name) 0
        set _ameba_first_fail_times($core_name) 0
    }
    set last_start_time $_ameba_first_fail_times($core_name)
    if { $_ameba_fail_counts($core_name) == 0 || ($current_time - $last_start_time) > 30 } {
        set _ameba_fail_counts($core_name) 1
        set _ameba_first_fail_times($core_name) $current_time
        echo "Warning: [string toupper $core_name] examine failed! Start counting (1/3 within 30s)"
    } else {
        incr _ameba_fail_counts($core_name)
        set time_elapsed [expr {$current_time - $last_start_time}]
        echo "Warning: [string toupper $core_name] examine failed! (Attempt $_ameba_fail_counts($core_name)/3, ${time_elapsed}s elapsed)"
    }
    if { $_ameba_fail_counts($core_name) >= 3 } {
        echo "Error: [string toupper $core_name] examine failed 3 times within 30 seconds! Shutting down OpenOCD..."
        set _ameba_fail_counts($core_name) 0
        shutdown
    }
}

# -----------------------------------------------------------------
# 4. DAP and Targets
# -----------------------------------------------------------------
set _CHIPNAME ameba

source [find target/swj-dp.tcl]

swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x01 -irmask 0x0f
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# --- KM4 (Cortex-M33, AHB-AP 2) — high-performance core ---
if { $ENABLE_KM4 } {
    set _KM4_TARGETNAME $_CHIPNAME.km4
    # -rtos FreeRTOS: expose the FreeRTOS task list to gdb (info threads). Needs uxTopUsedPriority
    # in the image (see main.c) + configUSE_TRACE_FACILITY=1. The thread list is gdb-driven, so a
    # working gdb (gdb-multiarch / arm-none-eabi-gdb) is required to render it; the on-device `tasks`
    # console command (vTaskList) gives the same list without gdb.
    target create $_KM4_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 2 -rtos FreeRTOS
    $_KM4_TARGETNAME configure -gdb-port 3335
    $_KM4_TARGETNAME configure -gdb-max-connections -1
    $_KM4_TARGETNAME configure -event examine-fail { ameba_examine_hook "KM4" }
    # M33 has no VECTRESET; reset via SYSRESETREQ (core-only reset).
    $_KM4_TARGETNAME cortex_m reset_config sysresetreq
}

# --- KM0 (Cortex-M23, AHB-AP 1) — low-power core ---
if { $ENABLE_KM0 } {
    set _KM0_TARGETNAME $_CHIPNAME.km0
    target create $_KM0_TARGETNAME cortex_m -dap $_CHIPNAME.dap -ap-num 1
    $_KM0_TARGETNAME configure -gdb-port 3331
    $_KM0_TARGETNAME configure -gdb-max-connections -1
    $_KM0_TARGETNAME configure -event examine-fail { ameba_examine_hook "KM0" }
    $_KM0_TARGETNAME cortex_m reset_config sysresetreq
}

# No SRST line wired on the typical AmebaD SWD bench; reset stays core-level.
reset_config none

# -----------------------------------------------------------------
# 5. Global Settings
# -----------------------------------------------------------------
gdb breakpoint_override hard
bindto 0.0.0.0

echo "GDB Server Init Success! ($ADAPTER_TYPE @ ${ADAPTER_SPEED}kHz) — KM4 :3335  KM0 :3331"
